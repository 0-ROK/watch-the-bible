<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Text Loading Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Noto Serif KR', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        #verse-container {
            width: 80%;
            max-width: 1200px;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.5;
            word-break: keep-all;
            /* Default color: dark gray, Highlighted color: gold */
            background-image: linear-gradient(to right, #FFD700 0%, #FFD700 var(--progress), #555555 var(--progress), #555555 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Enable smooth transitions for the custom property */
        @property --progress {
            syntax: '<percentage>';
            inherits: false;
            initial-value: 0%;
        }

        #info-container {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #reference {
            font-size: 1.5rem;
            font-weight: 400;
            color: #aaaaaa;
        }

        #time {
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-family: monospace;
            color: #888888;
        }
    </style>
</head>

<body>

    <div id="verse-container" style="--progress: 0%"></div>

    <div id="info-container">
        <div id="reference"></div>
        <div id="time"></div>
    </div>

    <div id="debug-panel"
        style="position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; display: none; flex-direction: column; gap: 10px; z-index: 1000;">
        <label style="font-size: 0.9rem; color: #ccc; cursor: pointer;">
            <input type="checkbox" id="debug-mode"> Debug 타임라인 활성화
        </label>
        <input type="range" id="debug-slider" min="0" max="86399" value="0" style="width: 250px; cursor: pointer;"
            disabled>
        <div id="debug-time-display"
            style="font-size: 0.8rem; color: #aaa; font-family: monospace; text-align: center;">00:00:00</div>
        <div style="font-size: 0.7rem; color: #777; text-align: center; margin-top: -5px;">(단축키 'd'로 창 닫기/열기)</div>
    </div>

    <script>
        let bibleData = [];

        // 데이터 원격 로드 (혹은 로컬 data.json 로드)
        async function loadBibleData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Data fetch failed');
                const newData = await response.json();
                if (newData && newData.length > 0) {
                    bibleData = newData;
                    // 데이터 갱신 후 즉각 화면 반영
                    forceUpdateText();
                }
            } catch (error) {
                console.error("Failed to load bible data:", error);
                // fetch가 로컬의 file:// 프로토콜에서 막힐 경우를 대비한 기본 폴백(Fallback) 데이터
                if (bibleData.length === 0) {
                    bibleData = [
                        { hour: 1, text: "몸이 하나이요 성령이 하나이니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 입었느니라", reference: "에베소서 4:4 (기본값)" },
                        { hour: 2, text: "두 사람이 한 사람보다 나음은 저희가 수고함으로 좋은 상을 얻을 것임이라", reference: "전도서 4:9 (기본값)" },
                        { hour: 3, text: "그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라", reference: "고린도전서 13:13 (기본값)" },
                        { hour: 4, text: "내가 보니 결박되지 아니한 네 사람이 불 가운데로 다니는데 상하지도 아니하였고 그 넷째의 모양은 신들의 아들과 같도다", reference: "다니엘 3:25 (기본값)" },
                        { hour: 5, text: "그러나 교회에서 네가 남을 가르치기 위하여 깨달은 마음으로 다섯 마디 말을 하는 것이 일만 마디 방언으로 말하는 것보다 나으니라", reference: "고린도전서 14:19 (기본값)" },
                        { hour: 6, text: "가로되 그가 내게 이 보리 여섯 번을 되어 주며 이르기를 빈 손으로 네 시어머니에게 가지 말라 하더이다", reference: "룻기 3:17 (기본값)" },
                        { hour: 7, text: "대저 의인은 일곱번 넘어질찌라도 다시 일어나려니와 악인은 재앙으로 인하여 엎드러지느니라", reference: "잠언 24:16 (기본값)" },
                        { hour: 8, text: "방주에서 물로 말미암아 구원을 얻은 자가 몇명 뿐이니 겨우 여덟 명이라", reference: "베드로전서 3:20 (기본값)" },
                        { hour: 9, text: "제 구 시에 예수께서 크게 소리지르시되 엘리 엘리 라마 사박다니 하시니", reference: "마가복음 15:34 (기본값)" },
                        { hour: 10, text: "예수께서 대답하여 가라사대 열 사람이 다 깨끗함을 받지 아니하였느냐 그 아홉은 어디 있느냐", reference: "누가복음 17:17 (기본값)" },
                        { hour: 11, text: "열 한 제자가 갈릴리에 가서 예수의 명하시던 산에 이르러 예수를 뵈옵고 경배하나", reference: "마태복음 28:16 (기본값)" },
                        { hour: 12, text: "다 배불리 먹고 남은 떡 조각과 물고기를 열 두 바구니에 차게 거두었으며", reference: "마가복음 6:42-43 (기본값)" }
                    ];
                }
            }
        }

        // 매 10분마다 데이터 갱신 (새로운 성경 구절이 추가되었는지 확인)
        setInterval(loadBibleData, 10 * 60 * 1000);

        const verseEl = document.getElementById('verse-container');
        const referenceEl = document.getElementById('reference');
        const timeEl = document.getElementById('time');

        const debugModeEl = document.getElementById('debug-mode');
        const debugSliderEl = document.getElementById('debug-slider');
        const debugTimeDisplayEl = document.getElementById('debug-time-display');
        const debugPanelEl = document.getElementById('debug-panel');

        // 'd' 키를 눌러 디버그 패널 토글, 'f' 키로 전체화면
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                if (debugPanelEl.style.display === 'none') {
                    debugPanelEl.style.display = 'flex';
                } else {
                    debugPanelEl.style.display = 'none';
                }
            } else if (e.key.toLowerCase() === 'f') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }
        });

        debugModeEl.addEventListener('change', (e) => {
            debugSliderEl.disabled = !e.target.checked;
        });

        debugSliderEl.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const h = Math.floor(val / 3600);
            const m = Math.floor((val % 3600) / 60);
            const s = val % 60;
            debugTimeDisplayEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        });

        function forceUpdateText() {
            if (bibleData.length === 0) return;
            const now = new Date();
            let hours = debugModeEl.checked ? Math.floor(parseInt(debugSliderEl.value) / 3600) : now.getHours();
            let displayHour = hours % 12;
            if (displayHour === 0) displayHour = 12;

            const verseData = bibleData.find(d => d.hour === displayHour) || bibleData[0];
            verseEl.textContent = verseData.text;
            referenceEl.textContent = verseData.reference;
        }

        function updateClock() {
            if (bibleData.length === 0) {
                requestAnimationFrame(updateClock);
                return;
            }

            let hours, minutes, seconds, milliseconds;

            if (debugModeEl.checked) {
                const val = parseInt(debugSliderEl.value);
                hours = Math.floor(val / 3600);
                minutes = Math.floor((val % 3600) / 60);
                seconds = val % 60;
                milliseconds = 0;
            } else {
                const now = new Date();
                hours = now.getHours();
                minutes = now.getMinutes();
                seconds = now.getSeconds();
                milliseconds = now.getMilliseconds();

                const currentTotalSeconds = hours * 3600 + minutes * 60 + seconds;
                debugSliderEl.value = currentTotalSeconds;
                debugTimeDisplayEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            // 12-hour format mapping (1-12)
            let displayHour = hours % 12;
            if (displayHour === 0) displayHour = 12;

            // Update text and reference if hour changed or on initial load
            const verseData = bibleData.find(d => d.hour === displayHour);
            if (verseEl.textContent !== verseData.text) {
                verseEl.textContent = verseData.text;
                referenceEl.textContent = verseData.reference;
            }

            // Calculate progress: ((minutes * 60) + seconds + (milliseconds / 1000)) / 3600 * 100
            const totalSecondsInHour = 3600;
            const currentSeconds = (minutes * 60) + seconds + (milliseconds / 1000);
            const progressPercent = (currentSeconds / totalSecondsInHour) * 100;

            // Apply progress to CSS custom property
            verseEl.style.setProperty('--progress', `${progressPercent.toFixed(4)}%`);

            // Update time text (HH:MM:SS)
            const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeEl.textContent = timeStr;

            // Loop to next frame
            requestAnimationFrame(updateClock);
        }

        // Initialize and start clock
        loadBibleData();
        requestAnimationFrame(updateClock);
    </script>
</body>

</html>
